<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="pocketpi">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<title>pocketpi</title>
</head>
<body>
<div id="app">
  <aside id="drawer" aria-label="Projects and chats">
    <nav id="rail" aria-label="Projects">
      <button class="rail-tile rail-all" data-project="" title="All chats">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <div class="rail-sep"></div>
      <div id="rail-projects"></div>
      <button class="rail-tile rail-add" id="add-project" title="Add project">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>
    <div id="panel">
      <div class="panel-head">
        <div class="panel-title-wrap">
          <div id="panel-title">All chats</div>
          <div id="panel-path"></div>
        </div>
        <button class="icon-btn" id="project-menu" aria-label="Project options" hidden>
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        </button>
      </div>
      <button id="new-chat" class="new-chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span>
      </button>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="search" type="search" placeholder="Search" autocomplete="off"></label>
      <div id="session-list" class="session-list"></div>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="menu" aria-label="Projects and chats">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
      </button>
      <button class="title-wrap" id="title-btn">
        <span id="project-badge" class="badge"></span>
        <span class="title-text">
          <span id="title">New chat</span>
          <span id="subtitle"></span>
        </span>
      </button>
      <button id="model-chip" class="model-chip" aria-label="Model and chat settings">
        <span id="ctx-ring" class="ctx-ring" style="--p:0"></span>
        <span id="model-name">…</span>
      </button>
      <div id="signal"></div>
    </header>
    <div id="banner" hidden></div>

    <section id="scroller">
      <div id="empty" class="empty">
        <div class="empty-mark" id="empty-mark"></div>
        <h1 id="empty-title">New chat</h1>
        <p id="empty-sub"></p>
        <button id="project-chip" class="project-chip">
          <span id="project-chip-badge" class="badge sm"></span>
          <span id="project-chip-name">Home</span>
          <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
        </button>
      </div>
      <div id="messages"></div>
      <div id="working" hidden><span class="sig-dot"></span><span id="working-text">Working</span></div>
    </section>

    <button id="jump" aria-label="Scroll to bottom" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </button>

    <footer id="composer-wrap">
      <div id="queue" hidden></div>
      <div id="slash" hidden></div>
      <form id="composer" autocomplete="off">
        <div id="attachments" hidden></div>
        <textarea id="input" rows="1" placeholder="Message pi" enterkeyhint="enter" autocapitalize="sentences"></textarea>
        <div class="composer-row">
          <label class="round-btn" aria-label="Attach image">
            <input id="file" type="file" accept="image/*" multiple hidden>
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </label>
          <button type="button" id="think-chip" class="think-chip" aria-label="Thinking level"></button>
          <span class="spacer"></span>
          <button type="submit" id="send" class="send" aria-label="Send" disabled>
            <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
          </button>
        </div>
      </form>
    </footer>
  </main>

  <div id="sheet-scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true"><div class="grabber"></div><div id="sheet-body"></div></div>
  <div id="toast" hidden></div>
</div>
<script src="/app.js"></script>
</body>
</html>
