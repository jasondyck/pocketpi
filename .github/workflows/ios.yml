# The iOS app, built and looked at without anybody's Mac.
#
#   kit  - PocketPiKit's unit and integration tests on Linux, against a scratch
#          pocketpi built from this commit with ios/fake-pi.py as pi (the same
#          thing ios/test-linux.sh does locally).
#   app  - on a macOS runner: generate the Xcode project from project.yml,
#          build for the simulator, run the UI tests, upload their screenshots.
#   testflight - (only with the testflight input) archive a signed build and
#          upload it to App Store Connect. Signed with the Apple Distribution
#          certificate (DIST_P12, DIST_P12_PASSWORD) and the "pocketpi App
#          Store" profile (ASC_PROFILE) from the repo secrets; uploaded with the
#          App Store Connect API key. The build number is the run number.
#
# Manual only (Actions -> iOS -> Run workflow, or `gh workflow run ios.yml --ref <branch>`): macOS minutes cost a multiple
# of Linux ones, and the Kit's tests run locally for free.
name: iOS

on:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          macOS runner. macos-26 (Xcode 26) is what App Store Connect accepts;
          macos-15 is fine for a compile check when 26 has no capacity.
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
      testflight:
        description: >-
          Also archive a signed build and upload it to TestFlight (needs
          macos-26 and the ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 secrets).
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PocketPiKit tests
        run: ios/test-linux.sh

  app:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    needs: kit
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Generate the project
        working-directory: ios/PocketPi
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for rt, xs in sorted(d.items(), reverse=True) if "iOS" in rt
                    for x in xs if x["name"].startswith("iPhone")]
          print(phones[0]["udid"])')
          echo "udid=$id" >> "$GITHUB_OUTPUT"
      - name: Build and run the UI tests
        working-directory: ios/PocketPi
        run: |
          set -o pipefail
          xcodebuild test -project PocketPi.xcodeproj -scheme PocketPi \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO | tail -200
      - name: Screenshots out of the result bundle
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" \
            --output-path "$RUNNER_TEMP/shots" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

  testflight:
    if: ${{ inputs.testflight }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    needs: app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      PROFILE_NAME: pocketpi App Store
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: |
          brew install xcodegen yq
          xcodebuild -version
      # Manual distribution signing for the app target's Release config only
      # (on the command line it would also hit the Swift package's targets,
      # which can't take a profile). Automatic signing can't archive here: it
      # signs for development first, which needs a registered device.
      - name: Generate the project
        working-directory: ios/PocketPi
        run: |
          yq -i '.targets.PocketPi.settings.configs.Release = {
            "CODE_SIGN_STYLE": "Manual",
            "CODE_SIGN_IDENTITY": "Apple Distribution",
            "PROVISIONING_PROFILE_SPECIFIER": strenv(PROFILE_NAME)}' project.yml
          xcodegen generate
      - name: Signing certificate, profile and API key
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          ASC_PROFILE: ${{ secrets.ASC_PROFILE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(openssl rand -hex 16)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            printf '%s' "$ASC_PROFILE" | base64 --decode > "$d/pocketpi_AppStore.mobileprovision"
          done
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          security find-identity -v -p codesigning "$kc"
      - name: Archive
        working-directory: ios/PocketPi
        run: |
          set -o pipefail
          xcodebuild archive -project PocketPi.xcodeproj -scheme PocketPi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PocketPi.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -200
      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>ca.caldron.pocketpi</key><string>$PROFILE_NAME</string>
            </dict>
            <key>teamID</key><string>57YB5MQBTL</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PocketPi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -100
      - name: Remove the keys
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/dist.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
